# LACRA Trace backend - Render Blueprint (pilot grade)
#
# Nothing in this file is a credential. Every secret is `sync: false`, which makes Render ask for the value in the
# dashboard when the Blueprint is first created. Full walkthrough: docs/RENDER_DEPLOY.md
#
# Resources (all new names, deliberately different from the earlier `lacra-trace-api` / `lacra-trace-db` attempt so that
# applying this Blueprint can never modify an existing service or database in the workspace):
#   * lacra-trace-pg      dedicated PostgreSQL 17 (NOT shared with CMIS or any other application)
#   * lacra-trace-kv      Key Value (Redis-compatible): OTP cache + Celery broker
#   * lacra-trace         web service (gunicorn)      -> https://lacra-trace.onrender.com
#   * lacra-trace-worker  Celery worker + beat        -> sends OTP SMS/e-mail, expires transactions, rolls seasons
#
# Region is the same for every resource (required for the private network). Frankfurt is the closest Render region to
# Liberia; change it before the first sync if you prefer another (it cannot be changed afterwards).
#
# Plans are paid on purpose: Render free Postgres expires after 30 days and has no backups, free web services spin
# down and cannot send SMTP, free Key Value does not persist. Check current prices in the Render dashboard.

services:
  - type: keyvalue
    name: lacra-trace-kv
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    # Private network only: an empty allow-list blocks every external connection.
    ipAllowList: []

  - type: web
    name: lacra-trace
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/system/healthcheck/
    autoDeployTrigger: "off"
    envVars:
      # --- Django ---------------------------------------------------------------------------------------------------
      - key: DJANGO_SETTINGS_MODULE
        value: lacra.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: lacra-trace.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://lacra-trace.onrender.com
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://lacra-trace.onrender.com
      # Render terminates TLS and forwards X-Forwarded-Proto: https
      - key: DJANGO_HTTP_X_FORWARDED_PROTO
        value: https
      - key: WEB_CONCURRENCY
        value: "2"
      # --- Admin bootstrap (createsuperuser --noinput in entrypoint.sh) ---------------------------------------------
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # --- PostgreSQL (dedicated instance) --------------------------------------------------------------------------
      - key: POSTGRES_HOST
        fromDatabase:
          name: lacra-trace-pg
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: lacra-trace-pg
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: lacra-trace-pg
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: lacra-trace-pg
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: lacra-trace-pg
          property: password
      # --- Key Value (OTP cache + Celery broker) --------------------------------------------------------------------
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lacra-trace-kv
          property: connectionString
      # --- SMS (Telnyx) - needed at import time, OTP delivery -------------------------------------------------------
      - key: SMS_TELNYX_API_KEY
        sync: false
      - key: SMS_TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: SMS_TELNYX_SENDER_ID
        sync: false
      # --- E-mail (SMTP) - needed at import time --------------------------------------------------------------------
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # --- File storage (S3-compatible): transaction location files ------------------------------------------------
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # --- Push notifications (Firebase) ----------------------------------------------------------------------------
      # Leave "False" until a Firebase service-account JSON is uploaded as a Secret File named fcm.json on BOTH the
      # `lacra-trace` and `lacra-trace-worker` services; then set to "True".
      - key: PUSH_NOTIFICATIONS_FCM_ENABLED
        value: "False"
      - key: PUSH_NOTIFICATIONS_FCM_CREDENTIALS_PATH
        value: /etc/secrets/fcm.json
      # --- Misc -----------------------------------------------------------------------------------------------------
      - key: SENTRY_ENVIRONMENT
        value: pilot

  - type: worker
    name: lacra-trace-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    # Worker + beat in ONE process so the pilot needs a single extra service. Never scale this service above 1 instance
    # (a second instance would run a second beat scheduler).
    dockerCommand: uv run --no-dev celery -A lacra.common worker -B -l INFO --concurrency 2
    numInstances: 1
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: lacra.settings
      # Same secret as the web service so both processes always agree.
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: lacra-trace
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_HTTP_X_FORWARDED_PROTO
        value: https
      - key: POSTGRES_HOST
        fromDatabase:
          name: lacra-trace-pg
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: lacra-trace-pg
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: lacra-trace-pg
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: lacra-trace-pg
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: lacra-trace-pg
          property: password
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lacra-trace-kv
          property: connectionString
      - key: SMS_TELNYX_API_KEY
        sync: false
      - key: SMS_TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: SMS_TELNYX_SENDER_ID
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: PUSH_NOTIFICATIONS_FCM_ENABLED
        value: "False"
      - key: PUSH_NOTIFICATIONS_FCM_CREDENTIALS_PATH
        value: /etc/secrets/fcm.json
      - key: SENTRY_ENVIRONMENT
        value: pilot

databases:
  - name: lacra-trace-pg
    region: frankfurt
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    databaseName: lacra_trace
    user: lacra_trace
    diskSizeGB: 15
    # Private network only; use `render psql` / a temporary allow-list entry for backups and restores.
    ipAllowList: []
