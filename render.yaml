services:
  # ─── Web API ───────────────────────────────────────────────────────────────
  - type: web
    name: lacra-trace-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/system/healthcheck/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: lacra.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://lacra-trace-api.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://lacra-trace-api.onrender.com"

      # PostgreSQL — auto-wired from database below
      - key: POSTGRES_HOST
        fromDatabase:
          name: lacra-trace-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: lacra-trace-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: lacra-trace-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: lacra-trace-db
          property: password

      # Redis — REQUIRED by settings.py at startup (no default).
      # Set REDIS_HOST + REDIS_PASSWORD to your Redis instance after first deploy.
      # Using placeholder values here so the container starts; replace ASAP.
      - key: REDIS_HOST
        value: "127.0.0.1"
      - key: REDIS_PASSWORD
        value: "placeholder-replace-me"
      - key: REDIS_PORT
        value: "6379"

      # Superuser (find generated password in Render dashboard after first deploy)
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@lacratrace.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

      # S3 storage — settings.py reads S3_ENDPOINT_URL, S3_REGION, S3_BUCKET_NAME,
      # S3_ACCESS_KEY, S3_SECRET_KEY. All optional (omitted = no file storage).
      # Fill in Render dashboard when you have an S3/MinIO instance ready.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET_NAME
        value: uploads
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

      # Push notifications (disabled by default)
      - key: PUSH_NOTIFICATIONS_FCM_ENABLED
        value: "False"
      - key: PUSH_NOTIFICATIONS_APNS_ENABLED
        value: "False"

      # SMS (disabled by default)
      - key: SMS_PROVIDER
        value: telnyx
      - key: SMS_GATEWAY_ENABLED
        value: "False"
      - key: SMS_PLIVO_ENABLED
        value: "False"
      - key: SMS_TELNYX_ENABLED
        value: "False"
      # SMS_TELNYX_API_KEY and SMS_TELNYX_MESSAGING_PROFILE_ID are required
      # by settings.py at import time (no default). Using placeholders so app
      # starts — SMS is disabled via SMS_TELNYX_ENABLED=False anyway.
      - key: SMS_TELNYX_API_KEY
        value: "placeholder-replace-when-ready"
      - key: SMS_TELNYX_SENDER_ID
        value: LACRA
      - key: SMS_TELNYX_MESSAGING_PROFILE_ID
        value: "placeholder-replace-when-ready"

      - key: CAPTCHA_TURNSTILE_SECRET_KEY
        sync: false

      # Email — required at settings import time (no default in settings.py)
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      # EMAIL_HOST_PASSWORD is required by settings.py at import time (no default).
      # Using placeholder so app starts — replace with real SMTP credentials.
      - key: EMAIL_HOST_USER
        value: "noreply@lacratrace.com"
      - key: EMAIL_HOST_PASSWORD
        value: "placeholder-replace-with-smtp-password"
      - key: DEFAULT_FROM_EMAIL
        value: noreply@lacratrace.com
      - key: EMAIL_USE_TLS
        value: "True"

      # Gunicorn worker count — cap at 2 for free tier (512MB RAM)
      - key: WEB_CONCURRENCY
        value: "2"
      # Render injects $PORT=10000 automatically for Docker web services.
      # Explicitly set here so gunicorn.conf.py picks it up correctly.
      - key: PORT
        value: "10000"

      - key: SENTRY_DSN
        value: ""
      - key: SENTRY_ENVIRONMENT
        value: production

# ─── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: lacra-trace-db
    plan: free
    databaseName: lacra
    user: lacra
