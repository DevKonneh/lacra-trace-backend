services:
  # ─── Web API ───────────────────────────────────────────────────────────────
  - type: web
    name: lacra-trace-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/system/healthcheck/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: lacra.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "https://lacra-trace-api.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://lacra-trace-api.onrender.com"

      # PostgreSQL — auto-wired from database below
      - key: POSTGRES_HOST
        fromDatabase:
          name: lacra-trace-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: lacra-trace-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: lacra-trace-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: lacra-trace-db
          property: password

      # Redis — fill manually in Render dashboard
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false

      # Superuser (find generated password in Render dashboard after first deploy)
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@lacratrace.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

      # S3 / MinIO — fill manually in Render dashboard
      - key: MINIO_HOST
        sync: false
      - key: MINIO_REGION
        value: us-east-1
      - key: MINIO_BUCKET_NAME
        value: uploads
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false

      # SMS (disabled by default — enable in dashboard when ready)
      - key: SMS_PROVIDER
        value: telnyx
      - key: SMS_GATEWAY_ENABLED
        value: "False"
      - key: SMS_PLIVO_ENABLED
        value: "False"
      - key: SMS_TELNYX_ENABLED
        value: "False"
      - key: SMS_TELNYX_API_KEY
        sync: false
      - key: SMS_TELNYX_SENDER_ID
        value: LACRA
      - key: SMS_TELNYX_MESSAGING_PROFILE_ID
        sync: false

      - key: CAPTCHA_TURNSTILE_SECRET_KEY
        sync: false

      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ─── Celery Worker ─────────────────────────────────────────────────────────
  # Uses Dockerfile.worker which has CMD ["uv", "run", ..., "worker"]
  - type: worker
    name: lacra-trace-celery-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: lacra.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: lacra-trace-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: lacra-trace-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: lacra-trace-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: lacra-trace-db
          property: password
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: MINIO_HOST
        sync: false
      - key: MINIO_REGION
        value: us-east-1
      - key: MINIO_BUCKET_NAME
        value: uploads
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: SMS_TELNYX_API_KEY
        sync: false
      - key: SMS_TELNYX_SENDER_ID
        value: LACRA
      - key: SMS_TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: CAPTCHA_TURNSTILE_SECRET_KEY
        sync: false

  # ─── Celery Beat ───────────────────────────────────────────────────────────
  # Uses Dockerfile.beat which has CMD ["uv", "run", ..., "beat"]
  - type: worker
    name: lacra-trace-celery-beat
    runtime: docker
    dockerfilePath: ./Dockerfile.beat
    dockerContext: .
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: lacra.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: lacra-trace-db
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: lacra-trace-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: lacra-trace-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: lacra-trace-db
          property: password
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: MINIO_HOST
        sync: false
      - key: MINIO_REGION
        value: us-east-1
      - key: MINIO_BUCKET_NAME
        value: uploads
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: SMS_TELNYX_API_KEY
        sync: false
      - key: SMS_TELNYX_SENDER_ID
        value: LACRA
      - key: SMS_TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: CAPTCHA_TURNSTILE_SECRET_KEY
        sync: false

# ─── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: lacra-trace-db
    plan: free
    databaseName: lacra
    user: lacra
